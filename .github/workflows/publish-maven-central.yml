name: Publish Maven Central

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
      CENTRAL_NAMESPACE: io.github.muzafferus

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify tests
        run: ./gradlew :apimirage-core:testDebugUnitTest :apimirage-retrofit:testDebugUnitTest :sample-app:testDebugUnitTest

      - name: Verify Sonatype token and namespace access
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          TOKEN="$(printf "%s:%s" "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w 0)"
          curl --fail --show-error --silent \
            -H "Authorization: Bearer $TOKEN" \
            "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=${CENTRAL_NAMESPACE}"

      - name: Publish release artifacts to Sonatype staging compatibility endpoint
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          ./gradlew \
            -PVERSION_NAME="$VERSION" \
            :apimirage-core:publishReleasePublicationToCentralPortalRepository \
            :apimirage-retrofit:publishReleasePublicationToCentralPortalRepository \
            closeAndReleaseCentralBundle \
            --info \
            --stacktrace
